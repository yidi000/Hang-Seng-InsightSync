<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InsightSync | Hang Seng Bank</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">IS</div>
          <div>
            <div class="brand-name">InsightSync</div>
            <div class="brand-subtitle">Hang Seng Bank</div>
          </div>
        </div>
        <nav class="nav">
          <button class="nav-item active" data-route="overview">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
            </span>
            <span>
              <strong>Dashboard</strong>
              <small>Portfolio view</small>
            </span>
          </button>
          <button class="nav-item" data-route="prospects">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </span>
            <span>
              <strong>Prospects</strong>
              <small>RM action list</small>
            </span>
          </button>
          <button class="nav-item" data-route="signals">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg>
            </span>
            <span>
              <strong>Signals</strong>
              <small>Market triggers</small>
            </span>
          </button>
          <button class="nav-item" data-route="companies">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path><path d="M9 9v.01"></path><path d="M9 12v.01"></path><path d="M9 15v.01"></path><path d="M9 18v.01"></path></svg>
            </span>
            <span>
              <strong>Companies</strong>
              <small>Fact layer</small>
            </span>
          </button>
          <button class="nav-item" data-route="copilot">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path></svg>
            </span>
            <span>
              <strong>Copilot</strong>
              <small>Evidence Q&amp;A</small>
            </span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <div class="status-dot" id="sidebar-status-dot"></div>
          <div>
            <strong id="sidebar-status">Checking backend</strong>
            <small id="sidebar-status-detail">FastAPI connection</small>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle">Actionable intelligence from reports, signals, and market data.</p>
          </div>
          <div class="api-controls">
            <label>
              API base
              <input id="api-base-input" autocomplete="off" />
            </label>
            <label>
              API key
              <input id="api-key-input" type="password" autocomplete="off" placeholder="optional" />
            </label>
            <button class="button primary" id="save-api-settings">Save</button>
            <button class="button" id="refresh-data">Refresh</button>
          </div>
        </header>

        <section id="content" class="content">
          <div class="loading-card">Loading InsightSync data...</div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="./app.js"></script>
  </body>
</html>
