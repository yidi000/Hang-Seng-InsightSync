services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file:
      - .env.shared-dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SQLITE_SOURCE_PATH: ${SQLITE_SOURCE_PATH:-insightsync/data/storage/demo/insightsync_demo.db}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn insightsync.backend.main:app --host 0.0.0.0 --port 8000"

  init:
    build: .
    env_file:
      - .env.shared-dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SQLITE_SOURCE_PATH: ${SQLITE_SOURCE_PATH:-insightsync/data/storage/demo/insightsync_demo.db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: python -m insightsync.backend.workflows.init_dev_backend

volumes:
  postgres_data:
